<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EU-jobs Embed</title>
<meta name="robots" content="noindex">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --card-bg: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.1);
  --border-strong: rgba(255,255,255,0.22);
  --fg: #e0e0e8;
  --fg2: #888894;
  --accent: #3b82f6;
  --drawer-bg: rgba(18, 18, 26, 0.98);
  --canvas-bg: #0a0a0f;
}

html[data-theme="light"] {
  --bg: #f8fafc;
  --bg2: #ffffff;
  --card-bg: rgba(0,0,0,0.03);
  --border: rgba(0,0,0,0.1);
  --border-strong: rgba(0,0,0,0.25);
  --fg: #0f172a;
  --fg2: #64748b;
  --accent: #2563eb;
  --drawer-bg: rgba(255, 255, 255, 0.98);
  --canvas-bg: #f1f5f9;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Embed Header */
#embed-header {
  padding: 8px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.embed-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--fg);
  text-decoration: none;
}
.embed-brand img { height: 22px; width: auto; border-radius: 4px; }

.embed-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.segmented-toggle {
  display: inline-flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}
.segmented-toggle button {
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 500;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
  transition: all 0.15s ease;
}
.segmented-toggle button.active {
  background: var(--card-bg);
  color: var(--fg);
  font-weight: 600;
}

select.custom-select {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  outline: none;
  cursor: pointer;
}

.color-toggle { display: flex; gap: 3px; }
.color-toggle button {
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
  transition: all 0.15s ease;
}
.color-toggle button.active {
  background: var(--card-bg);
  color: var(--fg);
  border-color: var(--border-strong);
  font-weight: 600;
}

/* Canvas Area */
#canvas-container {
  flex: 1;
  position: relative;
  width: 100%;
  overflow: hidden;
  background: var(--canvas-bg);
}
canvas#canvas { display: block; width: 100%; height: 100%; cursor: default; }

/* Embed Footer Banner */
#embed-footer {
  padding: 6px 12px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--fg2);
  flex-shrink: 0;
}
#embed-footer a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
#embed-footer a:hover { text-decoration: underline; }

/* Tooltip */
#tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--drawer-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.4;
  max-width: 280px;
  opacity: 0;
  transition: opacity 0.15s ease;
  z-index: 1000;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
}
#tooltip.visible { opacity: 1; }
#tooltip .tt-title { font-weight: 700; font-size: 13px; color: var(--fg); margin-bottom: 4px; }
#tooltip .tt-exposure { font-size: 11px; margin-bottom: 6px; }
#tooltip .tt-stats { display: grid; grid-template-columns: auto auto; gap: 2px 8px; font-size: 11px; }
#tooltip .tt-stats .label { color: var(--fg2); }
#tooltip .tt-stats .value { color: var(--fg); text-align: right; }
</style>
</head>
<body>

<div id="embed-header">
  <a href="https://eu-jobs.alexandrucruceanu.com" target="_blank" class="embed-brand">
    <img src="logo.png" alt="Logo">
    <span>EU-jobs</span>
  </a>

  <div class="embed-controls">
    <div class="segmented-toggle">
      <button id="btnViewTreemap" class="active" data-view="treemap">▤ Treemap</button>
      <button id="btnViewMatrix" data-view="matrix">☩ Matrix</button>
    </div>

    <div class="color-toggle" id="colorToggle">
      <button data-mode="exposure" class="active">AI Exposure</button>
      <button data-mode="pay">Pay</button>
      <button data-mode="outlook">Growth</button>
    </div>

    <select id="regionSelect" class="custom-select">
      <option value="eu">EU27</option>
      <option value="de">Germany</option>
      <option value="fr">France</option>
      <option value="es">Spain</option>
      <option value="it">Italy</option>
      <option value="nl">Netherlands</option>
      <option value="pl">Poland</option>
      <option value="se">Sweden</option>
      <option value="at">Austria</option>
      <option value="be">Belgium</option>
      <option value="ie">Ireland</option>
      <option value="pt">Portugal</option>
      <option value="ro">Romania</option>
      <option value="dk">Denmark</option>
      <option value="fi">Finland</option>
      <option value="cz">Czechia</option>
      <option value="gr">Greece</option>
      <option value="hu">Hungary</option>
    </select>
  </div>
</div>

<div id="canvas-container">
  <canvas id="canvas"></canvas>
</div>

<div id="embed-footer">
  <span>Eurostat 2023 · Gemini AI Scoring</span>
  <a href="https://eu-jobs.alexandrucruceanu.com" target="_blank" id="embedFullLink">
    <span>Explore Full Interactive Dataset ↗</span>
  </a>
</div>

<div id="tooltip">
  <div class="tt-title"></div>
  <div class="tt-exposure"></div>
  <div class="tt-stats"></div>
</div>

<script>
let data = [];
let rects = [];
let scatterNodes = [];
let groupRects = [];
let hovered = null;
let currentView = "treemap";
let colorMode = "exposure";
let currentRegion = "eu";
let payMin = 25000, payMax = 250000;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let dpr = window.devicePixelRatio || 1;
const MARGIN = 8, GAP = 1, CAT_PAD = 2;

const EDU_LEVELS = [
  "No formal educational credential", "High school diploma or equivalent",
  "Postsecondary nondegree award", "Some college, no degree",
  "Associate's degree", "Bachelor's degree", "Master's degree", "Doctoral or professional degree"
];

function boostContrast(t) {
  const c = (t - 0.5) * 2;
  const b = Math.sign(c) * Math.pow(Math.abs(c), 0.55);
  return b / 2 + 0.5;
}

function greenRedCSS(t, alpha = 1) {
  t = boostContrast(Math.max(0, Math.min(1, t)));
  let r, g, b;
  if (t < 0.5) {
    const s = t / 0.5;
    r = Math.round(30 + s * 200); g = Math.round(180 - s * 20); b = Math.round(40 - s * 20);
  } else {
    const s = (t - 0.5) / 0.5;
    r = Math.round(230 + s * 25); g = Math.round(160 - s * 130); b = Math.round(20 - s * 5);
  }
  return `rgba(${r},${g},${b},${alpha})`;
}

function tileColorCSS(d, alpha = 1) {
  if (colorMode === "exposure") return d.exposure != null ? greenRedCSS(d.exposure / 10, alpha) : `rgba(128,128,128,${alpha})`;
  if (colorMode === "outlook") return d.outlook != null ? greenRedCSS(1 - Math.max(0, Math.min(1, (d.outlook + 12) / 24)), alpha) : `rgba(128,128,128,${alpha})`;
  if (colorMode === "pay") {
    if (d.pay == null) return `rgba(128,128,128,${alpha})`;
    const lo = Math.max(1, payMin), hi = Math.max(lo + 1, payMax);
    const t = 1 - (Math.log(Math.max(lo, Math.min(hi, d.pay))) - Math.log(lo)) / (Math.log(hi) - Math.log(lo));
    return greenRedCSS(t, alpha);
  }
  return `rgba(128,128,128,${alpha})`;
}

function squarify(items, x, y, w, h) {
  if (items.length === 0) return [];
  if (items.length === 1) return [{ ...items[0], rx: x, ry: y, rw: w, rh: h }];
  const total = items.reduce((s, d) => s + d.value, 0);
  if (total === 0) return [];
  const results = [];
  let remaining = [...items], cx = x, cy = y, cw = w, ch = h;
  while (remaining.length > 0) {
    const remTotal = remaining.reduce((s, d) => s + d.value, 0);
    const vertical = cw >= ch;
    const side = vertical ? ch : cw;
    let row = [remaining[0]], rowSum = remaining[0].value;
    for (let i = 1; i < remaining.length; i++) {
      const candidate = [...row, remaining[i]];
      const candidateSum = rowSum + remaining[i].value;
      if (worstAspect(candidate, candidateSum, side, remTotal, vertical ? cw : ch) <
          worstAspect(row, rowSum, side, remTotal, vertical ? cw : ch)) {
        row = candidate; rowSum = candidateSum;
      } else break;
    }
    const rowFraction = rowSum / remTotal;
    const rowThickness = vertical ? cw * rowFraction : ch * rowFraction;
    let offset = 0;
    for (const item of row) {
      const itemFraction = item.value / rowSum;
      const itemLength = side * itemFraction;
      if (vertical) results.push({ ...item, rx: cx, ry: cy + offset, rw: rowThickness, rh: itemLength });
      else results.push({ ...item, rx: cx + offset, ry: cy, rw: itemLength, rh: rowThickness });
      offset += itemLength;
    }
    if (vertical) { cx += rowThickness; cw -= rowThickness; }
    else { cy += rowThickness; ch -= rowThickness; }
    remaining = remaining.slice(row.length);
  }
  return results;
}

function worstAspect(row, rowSum, side, totalArea, availableExtent) {
  const rowExtent = availableExtent * (rowSum / totalArea);
  if (rowExtent === 0) return Infinity;
  let worst = 0;
  for (const item of row) {
    const itemLen = side * (item.value / rowSum);
    if (itemLen === 0) continue;
    const aspect = Math.max(rowExtent / itemLen, itemLen / rowExtent);
    if (aspect > worst) worst = aspect;
  }
  return worst;
}

function layout() {
  const container = document.getElementById("canvas-container");
  const w = container.clientWidth;
  const h = container.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";

  if (currentView === "treemap") {
    const tx = MARGIN, ty = MARGIN, tw = w - MARGIN * 2, th = h - MARGIN * 2;
    const byCategory = {};
    for (const d of data) { if (!byCategory[d.category]) byCategory[d.category] = []; byCategory[d.category].push(d); }
    const categories = Object.keys(byCategory).map(cat => ({
      cat, items: byCategory[cat].sort((a, b) => (b.jobs || 0) - (a.jobs || 0)),
      value: byCategory[cat].reduce((s, d) => s + (d.jobs || 1), 0),
    })).sort((a, b) => b.value - a.value);

    groupRects = squarify(categories, tx, ty, tw, th);
    rects = [];
    for (const cr of groupRects) {
      const items = cr.items.map(d => ({ ...d, value: d.jobs || 1 }));
      const innerRects = squarify(items, cr.rx + CAT_PAD, cr.ry + CAT_PAD, cr.rw - CAT_PAD * 2, cr.rh - CAT_PAD * 2);
      for (const ir of innerRects) rects.push(ir);
    }
  } else {
    const padL = 50, padR = 20, padT = 25, padB = 40;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;
    const pays = data.filter(d => d.pay != null).map(d => d.pay);
    const minP = pays.length ? Math.min(...pays) * 0.85 : 15000;
    const maxP = pays.length ? Math.max(...pays) * 1.1 : 120000;
    const maxJobs = Math.max(...data.map(d => d.jobs || 1));

    scatterNodes = data.map(d => {
      const exp = d.exposure != null ? d.exposure : 5;
      const x = padL + (exp / 10) * plotW;
      const pay = d.pay != null ? d.pay : minP;
      const normY = Math.max(0, Math.min(1, (pay - minP) / (maxP - minP)));
      const y = padT + (1 - normY) * plotH;
      const r = 4 + Math.sqrt((d.jobs || 1) / maxJobs) * 16;
      return { ...d, x, y, r, padL, padR, padT, padB, minP, maxP };
    });
  }
}

function draw() {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.fillStyle = isLight ? "#f1f5f9" : "#0a0a0f";
  ctx.fillRect(0, 0, w, h);

  if (currentView === "treemap") {
    for (const r of rects) {
      const isH = r === hovered;
      const g = GAP / 2;
      ctx.fillStyle = tileColorCSS(r, isH ? 0.95 : 0.65);
      ctx.fillRect(r.rx + g, r.ry + g, r.rw - g * 2, r.rh - g * 2);

      if (isH) {
        ctx.strokeStyle = isLight ? "#000" : "#fff";
        ctx.lineWidth = 2;
        ctx.strokeRect(r.rx + g, r.ry + g, r.rw - g * 2, r.rh - g * 2);
      }

      if (r.rw > 40 && r.rh > 14) {
        ctx.save(); ctx.beginPath(); ctx.rect(r.rx + 2, r.ry + 2, r.rw - 4, r.rh - 4); ctx.clip();
        const fs = Math.min(12, Math.max(8, Math.min(r.rw / 10, r.rh / 3)));
        ctx.font = `500 ${fs}px -apple-system, system-ui, sans-serif`;
        ctx.fillStyle = isH ? (isLight ? "#000" : "#fff") : (isLight ? "#0f172a" : "#ffffff");
        ctx.textBaseline = "top";
        ctx.fillText(r.title, r.rx + 4, r.ry + 3);
        ctx.restore();
      }
    }
  } else {
    if (!scatterNodes.length) return;
    const { padL, padR, padT, padB, minP, maxP } = scatterNodes[0];
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const midX = padL + plotW / 2, midY = padT + plotH / 2;

    // Grid
    ctx.strokeStyle = isLight ? "rgba(0,0,0,0.08)" : "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i += 2) {
      const gx = padL + (i / 10) * plotW;
      ctx.beginPath(); ctx.moveTo(gx, padT); ctx.lineTo(gx, h - padB); ctx.stroke();
    }
    for (let i = 0; i <= 4; i++) {
      const gy = padT + (i / 4) * plotH;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(w - padR, gy); ctx.stroke();
    }

    for (const n of scatterNodes) {
      const isH = n === hovered;
      ctx.beginPath();
      ctx.arc(n.x, n.y, isH ? n.r + 2 : n.r, 0, Math.PI * 2);
      ctx.fillStyle = tileColorCSS(n, isH ? 0.95 : 0.65);
      ctx.fill();
      ctx.strokeStyle = isH ? (isLight ? "#000" : "#fff") : "rgba(255,255,255,0.2)";
      ctx.lineWidth = isH ? 2 : 1;
      ctx.stroke();
    }
  }
}

function hitTest(mx, my) {
  const rect = canvas.getBoundingClientRect();
  const cx = mx - rect.left, cy = my - rect.top;
  if (currentView === "treemap") {
    for (let i = rects.length - 1; i >= 0; i--) {
      const r = rects[i];
      if (cx >= r.rx && cx < r.rx + r.rw && cy >= r.ry && cy < r.ry + r.rh) return r;
    }
  } else {
    for (let i = scatterNodes.length - 1; i >= 0; i--) {
      const n = scatterNodes[i];
      if (Math.hypot(cx - n.x, cy - n.y) <= n.r + 2) return n;
    }
  }
  return null;
}

canvas.addEventListener("mousemove", (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit !== hovered) { hovered = hit; draw(); }
  if (hovered) {
    const tt = document.getElementById("tooltip");
    tt.querySelector(".tt-title").textContent = hovered.title;
    tt.querySelector(".tt-exposure").innerHTML = `AI Exposure: <b>${hovered.exposure}/10</b>`;
    tt.querySelector(".tt-stats").innerHTML = `
      <span class="label">Pay:</span><span class="value">€${(hovered.pay || 0).toLocaleString()}</span>
      <span class="label">Jobs:</span><span class="value">${(hovered.jobs || 0).toLocaleString()}</span>`;
    let tx = e.clientX + 12, ty = e.clientY - 12;
    if (tx + 280 > window.innerWidth) tx = e.clientX - 290;
    if (ty + 100 > window.innerHeight) ty = e.clientY - 100;
    tt.style.left = tx + "px"; tt.style.top = ty + "px";
    tt.classList.add("visible");
    canvas.style.cursor = "pointer";
  } else {
    document.getElementById("tooltip").classList.remove("visible");
    canvas.style.cursor = "default";
  }
});

canvas.addEventListener("mouseleave", () => {
  hovered = null;
  document.getElementById("tooltip").classList.remove("visible");
  draw();
});

canvas.addEventListener("click", (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit) {
    window.open(`https://eu-jobs.alexandrucruceanu.com/?job=${hit.code || hit.slug}&region=${currentRegion}`, "_blank");
  }
});

function loadData(region) {
  currentRegion = region.toLowerCase();
  fetch(`data_${currentRegion}.json?v=` + new Date().getTime())
    .then(r => r.json())
    .then(d => {
      data = d;
      const pays = data.filter(x => x.pay != null).map(x => x.pay);
      payMin = pays.length ? Math.min(...pays) : 25000;
      payMax = pays.length ? Math.max(...pays) : 250000;
      layout();
      draw();
      document.getElementById("embedFullLink").href = `https://eu-jobs.alexandrucruceanu.com/?region=${currentRegion}&view=${currentView}&layer=${colorMode}`;
    });
}

document.getElementById("btnViewTreemap").addEventListener("click", () => {
  currentView = "treemap";
  document.getElementById("btnViewTreemap").classList.add("active");
  document.getElementById("btnViewMatrix").classList.remove("active");
  layout(); draw();
});
document.getElementById("btnViewMatrix").addEventListener("click", () => {
  currentView = "matrix";
  document.getElementById("btnViewMatrix").classList.add("active");
  document.getElementById("btnViewTreemap").classList.remove("active");
  layout(); draw();
});

document.getElementById("colorToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || !btn.dataset.mode) return;
  colorMode = btn.dataset.mode;
  document.querySelectorAll("#colorToggle button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  draw();
});

document.getElementById("regionSelect").addEventListener("change", (e) => {
  loadData(e.target.value);
});

// Boot from query parameters
const params = new URLSearchParams(window.location.search);
currentRegion = params.get("region") || "eu";
currentView = params.get("view") || "treemap";
colorMode = params.get("layer") || "exposure";
const theme = params.get("theme") || "dark";
document.documentElement.setAttribute("data-theme", theme);

document.getElementById("regionSelect").value = currentRegion;
if (currentView === "matrix") {
  document.getElementById("btnViewMatrix").classList.add("active");
  document.getElementById("btnViewTreemap").classList.remove("active");
}
document.querySelectorAll("#colorToggle button").forEach(b => {
  b.classList.toggle("active", b.dataset.mode === colorMode);
});

loadData(currentRegion);
window.addEventListener("resize", () => { layout(); draw(); });
</script>
</body>
</html>
